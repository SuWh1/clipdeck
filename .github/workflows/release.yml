name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Stamp the version from the tag
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${GITHUB_REF_NAME#v}" Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${GITHUB_RUN_NUMBER}" Resources/Info.plist
      - name: Build a universal app
        run: ARCHS="arm64 x86_64" ./scripts/build-app.sh
      - name: Zip
        run: ditto -c -k --keepParent dist/Clipdeck.app Clipdeck.zip
      - name: Publish the release
        run: gh release create "$GITHUB_REF_NAME" Clipdeck.zip --title "Clipdeck $GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
